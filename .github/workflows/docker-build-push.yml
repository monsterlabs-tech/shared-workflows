name: Docker Build & Push (reusable)

# Builds a Docker image and pushes it to GHCR. The caller passes the
# repo-relative image name; tags are derived from inputs + sensible defaults
# (sha, branch, semver).

on:
  workflow_call:
    inputs:
      image:
        description: "Image name (without registry/owner). e.g. admin-api"
        required: true
        type: string
      context:
        required: false
        type: string
        default: "."
      dockerfile:
        required: false
        type: string
        default: "Dockerfile"
      build-args:
        description: "Newline-separated KEY=VALUE list"
        required: false
        type: string
        default: ""
      tag:
        description: "Explicit tag (e.g. semver from semantic-release). Optional."
        required: false
        type: string
        default: ""
      runs-on:
        description: |
          JSON array of runner labels.
          Single label:  '["ubuntu-latest"]'
          Multi label:   '["self-hosted", "maxim"]'
        required: false
        type: string
        default: '["ubuntu-latest"]'
    outputs:
      image-ref:
        description: |
          Fully qualified IMMUTABLE image reference. Resolves to
          ghcr.io/<owner>/<image>:<tag> when the `tag` input is set, otherwise
          to the :sha-<commit> tag. Never a branch (:main, :develop) or PR tag,
          so it is safe to deploy directly. Fails the build if neither is
          available rather than falling back to something floating.
        value: ${{ jobs.build.outputs.image-ref }}
      digest:
        value: ${{ jobs.build.outputs.digest }}
    secrets:
      ghcr-read-token:
        description: |
          Token with read:packages on monsterlabs-tech. Used to compose .npmrc
          for cross-repo @monsterlabs-tech/* package installs inside the Docker
          build. Image push to GHCR uses the workflow's GITHUB_TOKEN with the
          calling job's `permissions: packages: write`.
        required: false
      maxmind-license-key:
        description: |
          MaxMind licence key, mounted into the build as the BuildKit secret
          `maxmind-license-key` so a Dockerfile can download a GeoLite2
          database at build time:

            RUN --mount=type=secret,id=maxmind-license-key ...

          Optional. The secret file is ALWAYS mounted - empty when this isn't
          passed - so a Dockerfile that uses it can branch on an empty key and
          build without the database rather than failing. Never use a
          build-arg for this: build args are recorded in the image history and
          readable via `docker history`.
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    outputs:
      image-ref: ${{ steps.ref.outputs.image-ref }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      # Image push: use the workflow's GITHUB_TOKEN. The calling job has
      # `permissions: packages: write`, which gives GITHUB_TOKEN write access
      # to THIS repo's GHCR packages - which is what we push.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build-time npm install: needs read:packages for OTHER @monsterlabs-tech
      # packages (eslint-config, models). Caller passes a low-scope read token.
      - name: Compose .npmrc for build-time GitHub Packages auth
        run: |
          cat > /tmp/build-npmrc <<EOF
          @monsterlabs-tech:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${{ secrets.ghcr-read-token || secrets.GITHUB_TOKEN }}
          EOF

      # Written unconditionally so `secret-files` below can reference it in
      # every build. An absent key yields an empty file, which a consuming
      # Dockerfile is expected to treat as "skip the download".
      - name: Compose MaxMind licence key file for build-time GeoIP download
        run: |
          printf '%s' '${{ secrets.maxmind-license-key }}' > /tmp/build-maxmind-key

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=pr
            ${{ inputs.tag != '' && format('type=raw,value={0}', inputs.tag) || '' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: ${{ inputs.build-args }}
          # Mount .npmrc as a BuildKit secret. Dockerfiles that need to
          # install from @monsterlabs-tech use:
          #   RUN --mount=type=secret,id=npmrc,target=/root/.npmrc npm install
          # The secret is only mounted for that RUN; never written to a layer.
          secret-files: |
            npmrc=/tmp/build-npmrc
            maxmind-license-key=/tmp/build-maxmind-key

      - name: Resolve image-ref
        id: ref
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
          WANT_TAG: ${{ inputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          # image-ref must be an IMMUTABLE reference.
          #
          # This used to be `head -n1` of the metadata-action tag list, on the
          # assumption that the first tag is canonical. It is not: the list also
          # carries the branch tag (:main, :develop) and PR tags, and the order
          # is not a documented contract. On a push to main the branch tag came
          # first, so callers deployed :main - a floating tag whose contents can
          # change under a running service on any task restart. That put UK prod
          # auth-api and office-auth-api on :main and :develop; caught 2026-09-14.
          #
          # Resolve deliberately instead: the caller's explicit tag if given,
          # otherwise the immutable commit-sha tag. Never a branch or PR tag.
          if [ -n "$WANT_TAG" ]; then
            IMAGE_REF="$IMAGE:$WANT_TAG"
          else
            IMAGE_REF=$(printf '%s\n' "$TAGS" | grep -E ':sha-[0-9a-f]{40}$' | head -n1 || true)
          fi

          if [ -z "$IMAGE_REF" ]; then
            echo "::error::cannot resolve an immutable image-ref. Pass the 'tag' input, or ensure type=sha is in the metadata tags. Tags were:"
            printf '%s\n' "$TAGS"
            exit 1
          fi

          # Never hand back a reference that was not actually pushed - a typo in
          # `tag` would otherwise surface as a deploy-time image pull failure.
          if ! printf '%s\n' "$TAGS" | grep -Fxq "$IMAGE_REF"; then
            echo "::error::resolved image-ref '$IMAGE_REF' is not among the pushed tags:"
            printf '%s\n' "$TAGS"
            exit 1
          fi

          echo "image-ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
          echo "Built:  $IMAGE_REF"
          echo "Digest: $DIGEST"
